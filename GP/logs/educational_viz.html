<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City Simulation - Low Level Event Visualizer</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1e1e; color: #d4d4d4; margin: 0; padding: 20px; }
        h1 { color: #569cd6; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .controls { margin-bottom: 20px; background: #252526; padding: 10px; border-radius: 4px; }
        button { background: #0e639c; color: white; border: none; padding: 8px 16px; cursor: pointer; font-size: 14px; border-radius: 2px; }
        button:hover { background: #1177bb; }
        
        /* Swimlane Layout */
        #visualization { display: grid; grid-template-columns: 100px repeat(6, 1fr); gap: 2px; background: #333; overflow-x: auto; min-width: 1200px; }
        .header-cell { background: #3c3c3c; padding: 10px; font-weight: bold; text-align: center; position: sticky; top: 0; z-index: 10; border-bottom: 2px solid #007acc; }
        
        .time-cell { background: #252526; padding: 5px; font-family: monospace; font-size: 12px; text-align: right; color: #858585; border-right: 1px solid #444; }
        
        .event-cell { padding: 8px; font-size: 13px; position: relative; border-bottom: 1px solid #2d2d2d; min-height: 40px; }
        .event-cell:hover { background: #2a2d2e; }
        
        /* Categories Colors */
        .cat-KERNEL { border-left: 4px solid #dcdcaa; color: #dcdcaa; background: #252526; }
        .cat-THREAD { border-left: 4px solid #c586c0; color: #c586c0; background: #252526; }
        .cat-DATABASE { border-left: 4px solid #ce9178; color: #ce9178; background: #252526; }
        .cat-DATA { border-left: 4px solid #4ec9b0; color: #4ec9b0; background: #252526; }
        .cat-SYNC { border-left: 4px solid #569cd6; color: #569cd6; background: #252526; }
        
        .payload { display: block; color: #9cdcfe; font-size: 11px; margin-top: 4px; font-family: monospace; white-space: pre-wrap; }
        
        /* Thread State Indicators */
        .thread-state { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
        .state-running { background: #4ec9b0; box-shadow: 0 0 5px #4ec9b0; }
        .state-waiting { background: #d7ba7d; }
        .state-stopped { background: #f44747; }

        #drop-zone { border: 2px dashed #444; padding: 40px; text-align: center; margin: 20px 0; color: #888; }
        #drop-zone.dragover { background: #333; border-color: #0e639c; }
    </style>
</head>
<body>

    <h1>Simulation Thread & Event Trace</h1>
    
    <div class="controls">
        <p>Drag and drop <strong>educational_trace.log</strong> here to visualize the simulation flow.</p>
        <div id="drop-zone">Drop Log File Here</div>
    </div>

    <div id="visualization">
        <!-- Headers generated by JS -->
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const viz = document.getElementById('visualization');

        // Define swimlanes (Columns)
        const LANES = ['KERNEL', 'TRAFFIC', 'ENERGY', 'WASTE', 'EMERGENCY', 'DATABASE'];
        
        function initHeaders() {
            viz.innerHTML = '';
            const timeHeader = document.createElement('div');
            timeHeader.className = 'header-cell';
            timeHeader.textContent = 'TIME';
            viz.appendChild(timeHeader);

            LANES.forEach(lane => {
                const div = document.createElement('div');
                div.className = 'header-cell';
                div.textContent = lane;
                viz.appendChild(div);
            });
        }

        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => parseLog(event.target.result);
                reader.readAsText(file);
            }
        });

        function parseLog(text) {
            initHeaders();
            const lines = text.split('\n');
            // Regex: [TIME] [CATEGORY] Message | Payload
            const regex = /\[(.*?)\] \[(.*?)\] (.*?)(?: \| (.*))?$/;

            lines.forEach(line => {
                if (!line.trim()) return;
                const match = line.match(regex);
                if (!match) return; // Skip non-matching lines

                const [_, time, categoryRaw, message, payload] = match;
                const category = categoryRaw.trim();
                
                // Determine which Lane this belongs to
                let targetLane = 'KERNEL'; // Default
                
                const upperMsg = message.toUpperCase();
                
                if (category === 'DATABASE') targetLane = 'DATABASE';
                else if (upperMsg.includes('TRAFFIC')) targetLane = 'TRAFFIC';
                else if (upperMsg.includes('ENERGY')) targetLane = 'ENERGY';
                else if (upperMsg.includes('WASTE')) targetLane = 'WASTE';
                else if (upperMsg.includes('EMERGENCY')) targetLane = 'EMERGENCY';
                else if (category === 'KERNEL' || category === 'SYNC') targetLane = 'KERNEL';
                
                // Render Row
                // 1. Time Cell
                const timeDiv = document.createElement('div');
                timeDiv.className = 'time-cell';
                timeDiv.textContent = time;
                viz.appendChild(timeDiv);

                // 2. Empty cells or Event cells
                LANES.forEach(lane => {
                    const cell = document.createElement('div');
                    cell.className = 'event-cell'; // Default empty
                    
                    if (lane === targetLane) {
                        cell.classList.add(`cat-${category.split(' ')[0]}`); // e.g. cat-DATA
                        
                        let content = `<strong>${category}</strong><br>${message}`;
                        
                        // Add icons/indicators
                        if (message.includes("WAITING")) content = `<span class="thread-state state-waiting"></span>` + content;
                        else if (message.includes("RUNNING")) content = `<span class="thread-state state-running"></span>` + content;
                        
                        if (payload) {
                            content += `<span class="payload">${payload}</span>`;
                        }
                        cell.innerHTML = content;
                    }
                    viz.appendChild(cell);
                });
            });
        }
        
        initHeaders();
    </script>
</body>
</html>
